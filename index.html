<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Story Shelf"><meta name="theme-color" content="#ff8a3d">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Story Shelf</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#ffe9a8,#ffd1dc);color:#3b2a1a;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
h1{margin:0;font-size:34px;color:#e8562a;text-shadow:2px 2px 0 #fff;white-space:nowrap}
.search{flex:1;display:flex;align-items:center;background:#fff;border-radius:40px;padding:6px 18px;box-shadow:0 4px 0 #e0a24d;border:4px solid #ffb347}
.search input{flex:1;border:none;outline:none;font-size:26px;font-family:inherit;padding:8px;min-width:0;background:none}
.search span{font-size:30px}
nav.tabs{display:flex;gap:8px;padding:6px 16px;overflow-x:auto}
nav.tabs button{font-size:20px;padding:10px 16px;border-radius:20px;background:#fff8;color:#6b4a2b;font-weight:bold;white-space:nowrap}
nav.tabs button.on{background:#e8562a;color:#fff;box-shadow:0 3px 0 #a33}
.cats{display:flex;gap:10px;padding:6px 16px 10px;overflow-x:auto;flex-shrink:0}
.cats button{font-size:21px;padding:12px 18px;border-radius:18px;color:#fff;font-weight:bold;white-space:nowrap;box-shadow:0 4px 0 #0003}
.cats button.on{outline:5px solid #fff;transform:scale(1.05)}
main{flex:1;overflow-y:auto;padding:4px 16px 40px;-webkit-overflow-scrolling:touch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;padding:14px;background:repeating-linear-gradient(#0000 0 262px,#a0632f 262px 280px);border-radius:16px}
.book{position:relative;text-align:center;background:none;padding:0}
.book svg,.book img{width:100%;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;box-shadow:4px 6px 0 #0003;display:block;background:#ddd;object-fit:cover}
.book .t{font-size:15px;font-weight:bold;margin-top:6px;color:#4a2f18;line-height:1.15;height:36px;overflow:hidden}
.book .fav{position:absolute;top:4px;right:6px;font-size:24px}
.book .st{position:absolute;bottom:46px;left:0;right:0;font-size:18px}
.len{position:absolute;top:56%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:bold;color:#fff;padding:3px 8px;border-radius:10px;box-shadow:0 2px 0 #0003}.len.S{background:#2ec46b}.len.M{background:#f2a81d}.len.L{background:#e8562a}
#clist button{display:block;width:100%;text-align:left;font-size:22px;padding:12px 16px;margin:6px 0;border-radius:14px;background:#fff3d6}#clist button.on{background:#ffcf6e;font-weight:bold}
.cats .sep{width:4px;background:#0002;border-radius:2px;flex-shrink:0}
.empty{font-size:26px;text-align:center;padding:40px}
.hint{font-size:20px;margin:6px 4px 10px;color:#7a5230}
.ol a{display:inline-block;margin-top:4px;background:#2e9e5b;color:#fff;padding:6px 12px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:bold}
.ol .no{font-size:13px;color:#866}
/* reader */
#reader{position:fixed;inset:0;background:#fffaf0;display:none;flex-direction:column;z-index:5}
#reader.show{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#ffcf6e;flex-wrap:wrap}
.rbar button{font-size:22px;padding:10px 14px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #c9902f;font-weight:bold;color:#5a3a1a}
.rbar .title{flex:1;font-size:20px;font-weight:bold;min-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#sfxTog.on{background:#b980f0;color:#fff}
#voiceTog.on{background:#3aa0ff;color:#fff}
#readBtn{background:#2ec46b;color:#fff}
#page{flex:1;padding:24px 6vw;overflow-y:auto;line-height:1.6;font-size:var(--fs,30px);touch-action:pan-y}
#page p{margin:0 0 .7em}
#page .pic{display:block;margin:0 auto .6em;max-width:100%;max-height:min(38vh,420px);width:auto;height:auto;border-radius:16px;box-shadow:0 4px 0 #0002;object-fit:contain}
#page svg.pic{width:min(100%,560px);height:auto;max-height:34vh}
@media (orientation:portrait){#page .pic{max-height:32vh}}
#page .w{border-radius:8px;padding:0 2px}
#page .w.hl{background:#ffe03a;box-shadow:0 0 0 3px #ffe03a}
.rfoot{display:flex;align-items:center;justify-content:space-between;padding:8px 16px calc(env(safe-area-inset-bottom) + 10px)}
.rfoot button{font-size:40px;width:110px;height:76px;border-radius:24px;background:#ff8a3d;color:#fff;box-shadow:0 5px 0 #c55}
.rfoot button:disabled{opacity:.3}
#pnum{font-size:22px;font-weight:bold}
/* modals */
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.card{background:#fff;border-radius:30px;padding:28px;text-align:center;max-width:92vw;width:620px;box-shadow:0 10px 0 #0003}
.card h2{font-size:32px;margin:6px 0 18px}
.card .big{display:block;width:100%;font-size:32px;padding:22px;border-radius:24px;margin:12px 0;font-weight:bold;color:#fff}
.vy{background:#3aa0ff;box-shadow:0 6px 0 #1f6fc0}.vn{background:#ff8a3d;box-shadow:0 6px 0 #c55}
.big.last{outline:6px solid #ffd400}
.stars button{font-size:60px;background:none;filter:grayscale(1);opacity:.5}
.stars button.on{filter:none;opacity:1}
.card .small{font-size:22px;padding:12px 22px;border-radius:16px;background:#eee;margin:8px}
@media (max-height:600px){.shelf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));background:repeating-linear-gradient(#0000 0 220px,#a0632f 220px 236px)} h1{font-size:26px}}
</style></head><body>
<div id="app">
 <header><h1>📚 Story Shelf</h1>
  <label class="search"><span>🔍</span><input id="q" placeholder="Find a book… (title, author, topic)" autocomplete="off"></label></header>
 <nav class="tabs" id="tabs"><button data-t="all" class="on">📚 All Books</button><button data-t="fav">❤️ Favorites</button><button data-t="read">⭐ Books I Read</button><button data-t="online">🌍 Find More Online</button></nav>
 <div class="cats" id="cats"></div>
 <main id="main"></main>
</div>
<div id="reader">
 <div class="rbar"><button id="back">🏠</button><div class="title" id="rtitle"></div>
  <button id="voiceTog">🔊 Voice</button><button id="readBtn">▶️ READ TO ME</button>
  <button id="chBtn">📑 Chapters</button><button id="sfxTog">🔈 Sounds ON</button><button id="aMinus">A−</button><button id="aPlus">A+</button><button id="rfav">🤍</button></div>
 <div id="page"></div>
 <div class="rfoot"><button id="prev">◀</button><div id="pnum"></div><button id="next">▶</button></div>
</div>
<div class="modal" id="vmodal"><div class="card"><h2 id="vtitle">How do you want to read?</h2>
 <button class="big vy" id="chooseVoice">🔊 Read to me</button><button class="big vn" id="chooseSelf">📖 I'll read myself</button></div></div>
<div class="modal" id="cmodal"><div class="card" style="max-height:85vh;overflow:auto"><h2>📑 Chapters</h2><div id="clist"></div><button class="small" id="cclose">✖ Close</button></div></div>
<div class="modal" id="dmodal"><div class="card"><h2>🎉 You finished the book!</h2><div style="font-size:24px">How many stars?</div>
 <div class="stars" id="stars"><button>⭐</button><button>⭐</button><button>⭐</button></div>
 <button class="small" id="again">📖 Read again</button><button class="small" id="home2">🏠 Bookshelf</button></div></div>
<script src="books.js"></script>
<script>
const $=s=>document.querySelector(s);
const CATS=[['Animals','🐾','#36a852'],['Adventure','🗺️','#e8562a'],['Funny','😂','#f2a81d'],['Fairy Tales','🏰','#a857d8'],['Bedtime','🌙','#3a5bd9'],['Science','🔬','#16a3b5']];
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('rl_'+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem('rl_'+k,JSON.stringify(v))};
let favs=LS.get('favs',[]),readL=LS.get('read',{}),fs=LS.get('fs',30),voice=LS.get('voice',null);
let tab='all',cat=null,lenF=null,pos=LS.get('pos',{});
function lenOf(b){const n=b.chapters.length;if(n>1)return['L','Long',n+' chapters'];const p=Math.max(1,Math.round(b.words/90));return b.words<1500?['S','Short',p+(p==1?' page':' pages')]:b.words<8000?['M','Medium',p+' pages']:['L','Long',p+' pages']}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const PAL=[['#ff6b6b','#ffd93d'],['#4d96ff','#6bcbff'],['#6bcb77','#d4f77a'],['#b980f0','#ffb3e6'],['#ff9f45','#ffe56b'],['#00b8a9','#a6f0c6'],['#f15bb5','#fee440'],['#3a5bd9','#9bb4ff']];
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function wrapT(t,n){const w=t.split(' '),L=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){L.push(l.trim());l=x}else l+=' '+x}L.push(l.trim());return L.slice(0,4)}
function cover(b){const h=hash(b.id),[a,c]=PAL[h%PAL.length];const lines=wrapT(b.title.replace(/^The Tale of /,'The Tale of\n').replace('\n',' '),13);
 const dots=[...Array(6)].map((_,i)=>`<circle cx="${(h>>i)%300}" cy="${(h>>(i+3))%400}" r="${10+(h>>i)%25}" fill="#fff" opacity=".18"/>`).join('');
 return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>
 <rect width="300" height="400" fill="url(#g${h})"/>${dots}<rect x="0" width="22" height="400" fill="#0002"/>
 <circle cx="155" cy="${lines.length>2?250:235}" r="78" fill="#fff" opacity=".85"/><text x="155" y="${lines.length>2?278:263}" font-size="88" text-anchor="middle">${b.emoji}</text>
 <rect x="30" y="18" width="250" height="${30+lines.length*34}" rx="16" fill="#fff" opacity=".9"/>
 ${lines.map((l,i)=>`<text x="155" y="${52+i*34}" font-size="28" font-weight="bold" text-anchor="middle" fill="#3b2a1a" font-family="Trebuchet MS,sans-serif">${esc(l)}</text>`).join('')}
 <text x="155" y="380" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Trebuchet MS,sans-serif">${esc(b.author.split(' (')[0])}</text></svg>`}
function renderCats(){$('#cats').style.display=tab==='online'?'none':'flex';
 $('#cats').innerHTML=CATS.map(([n,e,c])=>`<button data-c="${n}" style="background:${c}" class="${cat===n?'on':''}">${e} ${n}</button>`+'').join('')+'<span class="sep"></span>'+[['S','🐣 Short','#2ec46b'],['M','📗 Medium','#f2a81d'],['L','📚 Long','#e8562a']].map(([k,n,c])=>`<button data-l="${k}" style="background:${c}" class="${lenF===k?'on':''}">${n}</button>`).join('');
 $('#cats').querySelectorAll('button[data-c]').forEach(x=>x.onclick=()=>{cat=cat===x.dataset.c?null:x.dataset.c;render()});
 $('#cats').querySelectorAll('button[data-l]').forEach(x=>x.onclick=()=>{lenF=lenF===x.dataset.l?null:x.dataset.l;render()})}
function render(){renderCats();if(tab==='online')return online();
 const q=$('#q').value.trim().toLowerCase();let L=BOOKS;
 if(tab==='fav')L=L.filter(b=>favs.includes(b.id));
 if(tab==='read')L=L.filter(b=>readL[b.id]);
 if(cat)L=L.filter(b=>b.cat===cat);
 if(lenF)L=L.filter(b=>lenOf(b)[0]===lenF);
 if(q)L=L.filter(b=>q.split(/\s+/).every(w=>(b.title+' '+b.author+' '+b.cat+' '+b.topics+' '+lenOf(b)[1]+(b.chapters.length>1?' chapter book':'')).toLowerCase().includes(w)));
 let head=q?`<div class="hint">Found ${L.length} book${L.length==1?'':'s'} for “${esc(q)}”${L.length?'':' — try 🌍 Find More Online!'}</div>`:'';
 if(!L.length){$('#main').innerHTML=head+`<div class="empty">${tab==='fav'?'Tap 🤍 in a book to save it here!':tab==='read'?'Finish a book to get stars here! ⭐':'No books found 🙈'}</div>`;return}
 $('#main').innerHTML=head+'<div class="shelf">'+L.map(b=>`<button class="book" data-id="${b.id}">${cover(b)}<span class="len ${lenOf(b)[0]}">${lenOf(b)[1]} · ${lenOf(b)[2]}</span>${pos[b.id]&&!readL[b.id]?'<span class="st">🔖</span>':''}${favs.includes(b.id)?'<span class="fav">❤️</span>':''}${readL[b.id]?`<span class="st">${'⭐'.repeat(readL[b.id])}</span>`:''}<div class="t">${esc(b.title)}</div></button>`).join('')+'</div>';
 $('#main').querySelectorAll('.book').forEach(x=>x.onclick=()=>openBook(x.dataset.id))}
let olT;function online(){const q=$('#q').value.trim();
 if(!q){$('#main').innerHTML='<div class="empty">🌍 Type in the search bar to find more books on Open Library!</div>';return}
 $('#main').innerHTML='<div class="empty">🔎 Looking…</div>';clearTimeout(olT);olT=setTimeout(async()=>{try{
  const r=await fetch('https://openlibrary.org/search.json?limit=30&fields=key,title,author_name,cover_i,ia,ebook_access,has_fulltext&q='+encodeURIComponent(q+' juvenile')).then(r=>r.json());
  let D=r.docs;if(!D.length)D=(await fetch('https://openlibrary.org/search.json?limit=30&fields=key,title,author_name,cover_i,ia,ebook_access,has_fulltext&q='+encodeURIComponent(q)).then(r=>r.json())).docs;
  if($('#q').value.trim()!==q||tab!=='online')return;
  $('#main').innerHTML=`<div class="hint">Books from Open Library (needs internet)</div><div class="shelf ol">`+D.map(d=>{const t=esc(d.title||'');const img=d.cover_i?`<img loading="lazy" src="https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg" alt="">`:cover({id:d.key,title:d.title||'',emoji:'📕',author:(d.author_name||[''])[0]});
   const link=d.ebook_access==='public'&&d.ia?`<a target="_blank" rel="noopener" href="https://archive.org/details/${d.ia[0]}">📖 Read online</a>`:d.ebook_access==='borrowable'||d.ebook_access==='printdisabled'?`<a target="_blank" rel="noopener" href="https://openlibrary.org${d.key}" style="background:#3a5bd9">🔗 See book</a>`:`<a target="_blank" rel="noopener" href="https://openlibrary.org${d.key}" style="background:#999">🔗 See book</a>`;
   return `<div class="book">${img}<div class="t">${t}</div>${link}</div>`}).join('')+'</div>';
 }catch(e){$('#main').innerHTML='<div class="empty">📡 No internet right now. Try the books on your shelf!</div>'}},450)}
$('#q').oninput=render;
$('#tabs').querySelectorAll('button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;$('#tabs').querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===x));render()});
// reader
let book,ci=0,pages=[],pi=0,speaking=false,utt=null;
function paginate(){const budget=Math.round(420*(30/fs)**2*Math.max(.6,Math.min(1.8,innerWidth*innerHeight/(1024*768))));
 pages=[];let cur=[],n=0;
 const chunks=[];book.chapters[ci].text.forEach(p=>{if(p.length<=budget)chunks.push([p,1]);else{const S=p.match(/[^.!?]+[.!?”"’']*\s*/g)||[p];let c='';S.forEach(s=>{if((c+s).length>budget&&c){chunks.push([c.trim(),0]);c=''}c+=s});chunks.push([c.trim(),1])}});
 chunks.forEach(([c])=>{if(n+c.length>budget&&cur.length){pages.push(cur);cur=[];n=0}cur.push(c);n+=c.length+15});if(cur.length)pages.push(cur)}
function scene(b,k){const S=b.scenes&&b.scenes.length?b.scenes:[b.emoji];const e=[...new Intl.Segmenter().segment(S[k%S.length])].map(x=>x.segment);const night=b.cat==='Bedtime'||/🌙|🕯️/.test(S[k%S.length]);const h=hash(b.id+k);
 const sky=night?['#1d2b64','#5a4fcf']:[['#7ec8ff','#d6f1ff'],['#ffb36b','#ffe9b0'],['#9be7ff','#e3fff6']][h%3];
 const xs=e.length==1?[280]:e.length==2?[190,370]:e.length==3?[140,280,420]:[110,220,340,450];
 return `<svg class="pic" viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="s${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="560" height="300" rx="24" fill="url(#s${h})"/>
 ${night?[...Array(12)].map((_,i)=>`<circle cx="${(h*(i+3)*37)%560}" cy="${(h*(i+7)*13)%140}" r="2.5" fill="#fff"/>`).join('')+'<circle cx="480" cy="60" r="30" fill="#fff6c2"/><circle cx="494" cy="52" r="28" fill="'+sky[0]+'"/>':'<circle cx="480" cy="62" r="34" fill="#ffe03a"/><ellipse cx="120" cy="60" rx="50" ry="18" fill="#fff" opacity=".9"/><ellipse cx="300" cy="40" rx="40" ry="14" fill="#fff" opacity=".8"/>'}
 <path d="M0 220 Q140 170 280 215 T560 205 V300 H0Z" fill="${night?'#2f6b3a':'#6bcb77'}"/><path d="M0 250 Q200 225 360 255 T560 245 V300 H0Z" fill="${night?'#245a2f':'#4caf50'}"/>
 ${e.map((x,i)=>`<text x="${xs[i]}" y="${i==0?235:228+((h>>i)&1)*14}" font-size="${i==0?110:86}" text-anchor="middle">${x}</text>`).join('')}</svg>`}
function picFor(){const ch=book.chapters[ci],im=ch.img||[],P=pages.length;
 if(im.length){const per=Math.max(1,Math.min(3,Math.floor(P/im.length)||1));if(pi%per===0){const k=Math.floor(pi/per);if(k<im.length)return `<img class="pic" loading="lazy" src="${im[k]}" alt="">`}
  if(pi>=im.length*per&&pi%3===0)return `<img class="pic" loading="lazy" src="${im[(pi/3|0)%im.length]}" alt="">`;return ''}
 return pi%3===0?scene(book,ci*7+pi/3):''}
function fitPic(){const pg=$('#page'),pic=pg.querySelector('.pic');if(!pic)return;pic.style.maxHeight='';const extra=pg.scrollHeight-pg.clientHeight;if(extra>2){const h=pic.getBoundingClientRect().height-extra-4;if(h<90)pic.style.display='none';else pic.style.maxHeight=h+'px'}}
function savePos(){pos[book.id]={c:ci,p:pi};LS.set('pos',pos)}
function showPage(){stopSpeak();pi=Math.max(0,Math.min(pi,pages.length-1));savePos();let off=0;const ch=book.chapters[ci],multi=book.chapters.length>1;
 $('#page').innerHTML=(multi&&pi==0?`<h2 style="margin:0 0 .5em;color:#e8562a">Chapter ${ci+1}: ${esc(ch.t)}</h2>`:'')+picFor()+pages[pi].map(p=>'<p>'+p.split(/(\s+)/).map(w=>{const s=off;off+=w.length;return /\S/.test(w)?`<span class="w" data-s="${s}">${esc(w)}</span>`:w}).join('')+'</p>'+(off++,'')).join('');
 fitPic();$('#page').querySelectorAll('img.pic').forEach(i=>i.onload=fitPic);$('#pnum').textContent=(multi?`Ch ${ci+1}/${book.chapters.length} · `:'')+`Page ${pi+1} of ${pages.length}`;const last=ci==book.chapters.length-1&&pi==pages.length-1;$('#prev').disabled=pi==0&&ci==0;$('#next').textContent=last?'🏁':'▶';
 $('#page').querySelectorAll('.w').forEach(w=>w.onclick=e=>{e.stopPropagation();if(!voice)return;stopSpeak();say(w.textContent.replace(/[^\w’'-]/g,''),.8);w.classList.add('hl');setTimeout(()=>w.classList.remove('hl'),700)});
 if(voice&&autoRead)setTimeout(readPage,350)}
let autoRead=false;
let AC=null,sfx=LS.get('sfx',true);
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}
['touchstart','pointerdown','keydown'].forEach(ev=>addEventListener(ev,function u(){const a=ac();if(a){const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}removeEventListener(ev,u,true)},true));
function flip(){if(!sfx)return;const a=ac();if(!a)return;const t=a.currentTime,d=.32,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),x=buf.getChannelData(0);
 for(let i=0;i<n;i++){const p=i/n;x[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*Math.min(1,p*1.15)),1.6)*(1+.5*Math.sin(p*40))}
 const s=a.createBufferSource();s.buffer=buf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;bp.frequency.setValueAtTime(700,t);bp.frequency.exponentialRampToValueAtTime(4200,t+d*.55);bp.frequency.exponentialRampToValueAtTime(1500,t+d);
 const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=300;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+d);
 s.connect(bp);bp.connect(hp);hp.connect(g);g.connect(a.destination);s.start(t)}
function chime(){if(!sfx)return;const a=ac();if(!a)return;const t=a.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.12,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.7);o.connect(g);g.connect(a.destination);o.start(t+i*.09);o.stop(t+i*.09+.8)})}
function setSfx(v){sfx=v;LS.set('sfx',v);$('#sfxTog').textContent=v?'🔈 Sounds ON':'🔇 Sounds OFF';$('#sfxTog').classList.toggle('on',v)}
function voicePick(){const V=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));return V.find(v=>/Samantha|Karen|Moira|Google US|Female/i.test(v.name))||V[0]}
function say(t,rate=.85,onb,onend){const u=new SpeechSynthesisUtterance(t);u.rate=rate;u.pitch=1.1;const v=voicePick();if(v)u.voice=v;u.onboundary=onb;u.onend=onend;speechSynthesis.speak(u);return u}
function stopSpeak(){speaking=false;try{speechSynthesis.cancel()}catch(e){}$('#readBtn').textContent='▶️ READ TO ME';document.querySelectorAll('.w.hl').forEach(x=>x.classList.remove('hl'))}
function readPage(){if(!('speechSynthesis' in window))return;stopSpeak();speaking=true;autoRead=true;$('#readBtn').textContent='⏸️ STOP';
 const txt=pages[pi].join(' ');const W=[...$('#page').querySelectorAll('.w')];
 utt=say(txt,.85,e=>{if(e.name&&e.name!=='word')return;W.forEach(x=>x.classList.remove('hl'));let k=W.findLastIndex(x=>+x.dataset.s<=e.charIndex);if(k>=0)W[k].classList.add('hl')},()=>{if(!speaking)return;speaking=false;W.forEach(x=>x.classList.remove('hl'));$('#readBtn').textContent='▶️ READ TO ME';nextPage()})}
function setVoice(v){voice=v;LS.set('voice',v);$('#voiceTog').textContent=v?'🔊 Voice ON':'🔇 Voice OFF';$('#voiceTog').classList.toggle('on',v);$('#readBtn').style.display=v?'':'none';if(!v){autoRead=false;stopSpeak()}}
function nextPage(){if(pi<pages.length-1){flip();pi++;showPage()}else if(ci<book.chapters.length-1){flip();ci++;pi=0;paginate();showPage()}else finish()}
function prevPage(){if(pi>0){flip();pi--;showPage()}else if(ci>0){flip();ci--;paginate();pi=pages.length-1;showPage()}}
function goCh(c){flip();ci=c;pi=0;paginate();showPage()}
function openBook(id){chime();setSfx(sfx);book=BOOKS.find(b=>b.id===id);const sp=pos[id];ci=sp?Math.min(sp.c,book.chapters.length-1):0;pi=sp?sp.p:0;$('#chBtn').style.display=book.chapters.length>1?'':'none';autoRead=false;$('#rtitle').textContent=book.emoji+' '+book.title;$('#rfav').textContent=favs.includes(id)?'❤️':'🤍';
 $('#page').style.setProperty('--fs',fs+'px');paginate();$('#page').style.setProperty('--fs',fs+'px');$('#reader').classList.add('show');setVoice(!!voice);showPage();
 $('#vtitle').textContent=book.emoji+' '+book.title;$('#chooseVoice').classList.toggle('last',voice===true);$('#chooseSelf').classList.toggle('last',voice===false);$('#vmodal').classList.add('show')}
$('#chooseVoice').onclick=()=>{$('#vmodal').classList.remove('show');setVoice(true);readPage()};
$('#chooseSelf').onclick=()=>{$('#vmodal').classList.remove('show');setVoice(false)};
$('#voiceTog').onclick=()=>{setVoice(!voice);if(voice)readPage()};
$('#readBtn').onclick=()=>speaking?(autoRead=false,stopSpeak()):readPage();
$('#back').onclick=()=>{stopSpeak();$('#reader').classList.remove('show');render()};
$('#prev').onclick=prevPage;
$('#sfxTog').onclick=()=>{setSfx(!sfx);if(sfx)flip()};
$('#next').onclick=nextPage;
$('#chBtn').onclick=()=>{$('#clist').innerHTML=book.chapters.map((c,i)=>`<button data-i="${i}" class="${i==ci?'on':''}">${i+1}. ${esc(c.t)}</button>`).join('');$('#clist').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#cmodal').classList.remove('show');goCh(+b.dataset.i)});$('#cmodal').classList.add('show')};
$('#cclose').onclick=()=>$('#cmodal').classList.remove('show');
function resize(d){const first=pages[pi][0];fs=Math.max(20,Math.min(56,fs+d));LS.set('fs',fs);$('#page').style.setProperty('--fs',fs+'px');paginate();pi=Math.max(0,pages.findIndex(p=>p.some(x=>first.startsWith(x.slice(0,30))||x.startsWith(first.slice(0,30)))));showPage()}
$('#aMinus').onclick=()=>resize(-4);$('#aPlus').onclick=()=>resize(4);
$('#rfav').onclick=()=>{favs=favs.includes(book.id)?favs.filter(x=>x!==book.id):[...favs,book.id];LS.set('favs',favs);$('#rfav').textContent=favs.includes(book.id)?'❤️':'🤍'};
let tx=null;$('#page').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#page').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60)(d<0?$('#next'):$('#prev')).click()});
$('#page').addEventListener('click',e=>{if(e.target.classList.contains('w')&&voice)return;const x=e.clientX/innerWidth;if(x>.75)$('#next').click();else if(x<.25)$('#prev').click()});
function finish(){stopSpeak();autoRead=false;paintStars(readL[book.id]||0);$('#dmodal').classList.add('show');delete pos[book.id];LS.set('pos',pos);if(!readL[book.id]){readL[book.id]=3;LS.set('read',readL);paintStars(3)}}
function paintStars(n){$('#stars').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i<n))}
$('#stars').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{readL[book.id]=i+1;LS.set('read',readL);paintStars(i+1)});
$('#again').onclick=()=>{$('#dmodal').classList.remove('show');goCh(0)};
$('#home2').onclick=()=>{$('#dmodal').classList.remove('show');$('#back').click()};
addEventListener('resize',()=>{if($('#reader').classList.contains('show')){const f=pages[pi][0];paginate();pi=Math.max(0,pages.findIndex(p=>p.includes(f)));showPage()}});
speechSynthesis?.getVoices();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
